<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="rudof: RDF data and shapes library implemented in Rust">
    <title>rudof: RDF implementation in Rust</title>
    <link href="index.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body>
    <main>
        <div id="logo">
            <img src="images/logo.png" alt="rudof logo">
        </div>
        <!-- Each letter of "rudof" is a link. The text below the letter is the same link.
             On hover, the letter shows the picture in the --picture variable. -->
        <div>
            <a class="letter" data-letter="r" style="--picture: url(images/github.png)" href="https://github.com/rudof-project/rudof" aria-hidden="true" tabindex="-1"></a>
            <a href="https://github.com/rudof-project/rudof">github</a>
        </div>
        <div class="minor">
            <a class="letter" data-letter="u" style="--picture: url(images/reading_book.png)" href="https://rudof-project.github.io/rudof/" aria-hidden="true" tabindex="-1"></a>
            <a href="https://rudof-project.github.io/rudof/">User manual</a>
        </div>
        <div>
            <a class="letter" data-letter="d" style="--picture: url(images/rudof_with_computer.png)" href="https://rudof-project.github.io/web-demo/" aria-hidden="true" tabindex="-1"></a>
            <a href="https://rudof-project.github.io/web-demo/">demo</a>
        </div>
        <div class="minor">
            <a class="letter" data-letter="o" style="--picture: url(images/issues.png)" href="https://github.com/rudof-project/rudof/issues" aria-hidden="true" tabindex="-1"></a>
            <a href="https://github.com/rudof-project/rudof/issues">issues</a>
        </div>
        <div>
            <a class="letter" data-letter="f" style="--picture: url(images/academic.png)" href="https://rudof-project.github.io/rudof/assets/pdf/rudof_demo.pdf" aria-hidden="true" tabindex="-1"></a>
            <a href="https://rudof-project.github.io/rudof/assets/pdf/rudof_demo.pdf">paper</a>
        </div>
    </main>
    <p>RDF data and shapes library (web design inspired from <a href="https://just.systems/">just</a>)</p>
</body>

</html>
